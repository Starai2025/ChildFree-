project_id = "black-childfree-development"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
enable_signup = true
enable_anonymous_sign_ins = false
site_url = "http://localhost:8081"
additional_redirect_urls = ["blackchildfree-dev://auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = true
otp_expiry = 600
otp_length = 6

[auth.email.template.magic_link]
subject = "Your Black Childfree sign-in code"
content_path = "./supabase/templates/email-otp.html"

[functions.onboarding]
verify_jwt = false

# Founder review verifies JWT, Auth user, founder allowlist, live session and TOTP AAL2 internally.
[functions.admin-review]
verify_jwt = false

# Date planner: the member is verified inside the function (supabase.auth.getUser), like admin-review.
[functions.date-planner]
verify_jwt = false

# Location update: authenticated inside the function; exact coordinates are discarded.
[functions.update-location]
verify_jwt = false

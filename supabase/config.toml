project_id = "black-childfree-development"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
enable_signup = true
enable_anonymous_sign_ins = false
site_url = "http://localhost:8081"
additional_redirect_urls = ["blackchildfree-dev://auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = true
otp_expiry = 600
otp_length = 6

[auth.email.template.magic_link]
subject = "Your Black Childfree sign-in code"
content_path = "./supabase/templates/email-otp.html"

[functions.onboarding]
verify_jwt = false

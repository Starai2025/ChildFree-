<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FREE MIDNIGHT — interactive demo</title>
<style>
:root{
  --ink:#222328; --paper:#FFFFFF; --surface:#FFFFFF; --mist:#F2F3F6; --slate:#6F727A;
  --marigold:#FFE2D2; --berry:#CB4708; --berry-ink:#FFFFFF; --ok:#287447; --warn:#9A5B00; --bad:#BC3434;
  --text:#222328; --muted:#71747D; --line:#EBEDF1; --chip:#F3F4F7;
  --serif:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;overflow-x:clip}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px}
.wordmark{font-family:var(--serif);font-size:21px;letter-spacing:-.01em;color:var(--text)}
.wordmark small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:0}
main{flex:1;padding:6px 20px 120px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.12;letter-spacing:-.015em;margin:18px 0 14px}
h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2;margin:26px 0 10px}
h3{font-size:16px;font-weight:600;margin:20px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
a{color:var(--berry)}
button,.btn{font:inherit;cursor:pointer;border-radius:14px;border:1.5px solid var(--text);background:transparent;color:var(--text);padding:12px 18px;font-weight:600;min-height:48px}
.btn-primary{background:var(--berry);border-color:var(--berry);color:var(--berry-ink)}
.btn-block{display:block;width:100%}
.btn-quiet{border-color:var(--line);font-weight:500}
.btn-link{border:0;padding:6px 0;min-height:0;color:var(--berry);font-weight:600;background:none}
.btn-danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
label{display:block;font-weight:600;font-size:15px;margin:16px 0 6px}
.hint{font-weight:400;color:var(--muted);font-size:13.5px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--text);outline:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q-text{font-weight:500;margin-bottom:10px}
.seg{display:flex;gap:8px}
.seg label{margin:0;flex:1;font-weight:500;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;background:var(--surface)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){border-color:var(--text);background:var(--chip)}
.seg label:has(input:focus-visible){outline:3px solid var(--marigold);outline-offset:2px}
.checks label{display:flex;align-items:center;gap:10px;font-weight:500;margin:8px 0}
.checks input{width:22px;height:22px;accent-color:var(--berry)}
.counter{font-size:12.5px;color:var(--muted);text-align:right;margin-top:4px}
.counter.bad{color:var(--bad)}
.errors{border:1.5px solid var(--bad);color:var(--bad);border-radius:12px;padding:12px 14px;margin:16px 0;font-size:14.5px}
.errors ul{margin:6px 0 0;padding-left:18px}
.pledge{font-family:var(--serif);font-size:20px;line-height:1.5}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.ph{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--chip);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:6px;right:6px;min-height:0;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.ph .n{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ph button.add{border:0;width:100%;height:100%;border-radius:0;color:var(--muted);font-weight:600}
/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:8px 0 14px}
.card-photo{position:relative;aspect-ratio:4/5;background:var(--chip)}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block}
.card-photo .nav{position:absolute;top:0;bottom:0;width:40%;border:0;background:transparent;border-radius:0;min-height:0;padding:0}
.card-photo .nav.prev{left:0}.card-photo .nav.next{right:0}
.dots{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:5px}
.dots i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.card-body{padding:18px 20px 8px}
.card-name{font-family:var(--serif);font-size:30px;line-height:1.1;margin:0}
.card-sub{color:var(--muted);margin:4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chip{background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.prompt{padding:16px 0;border-top:1px solid var(--line)}
.prompt .pq{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.prompt .pa{font-family:var(--serif);font-size:23px;line-height:1.35}
.bio{padding:14px 0;border-top:1px solid var(--line)}
.card-actions{display:flex;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--line)}
.card-actions .like{flex:1.4}
.card-actions .pass{flex:1}
.under{display:flex;justify-content:center;gap:22px;margin:6px 0 10px}
.under button{border:0;min-height:0;padding:6px;font-weight:500;color:var(--muted);font-size:14px}
.status{border-left:4px solid var(--marigold);padding:4px 0 4px 16px;margin:20px 0}
.status.ok{border-color:var(--ok)}.status.bad{border-color:var(--bad)}
/* Lists */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;text-align:left;font-weight:400;min-height:0}
.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--chip);flex:none}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--berry);flex:none}
.newm{display:flex;gap:14px;overflow-x:auto;padding:4px 0 10px}
.newm button{border:0;padding:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500;font-size:14px;width:72px;flex:none}
.newm img{width:68px;height:68px;border-radius:50%;object-fit:cover;background:var(--chip);border:2px solid var(--marigold)}
/* Chat */
.chat-head{display:flex;align-items:center;gap:12px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.chat-head .grow{flex:1}
.msgs{display:flex;flex-direction:column;gap:6px;padding:16px 0 150px}
.b{max-width:78%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--berry);color:var(--berry-ink);border-bottom-right-radius:6px}
.b.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.when{font-size:11.5px;color:var(--muted);margin:2px 4px 6px}
.when.me{align-self:flex-end}
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.composer .in{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:140px}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1 1 0;min-width:0;padding:0 2px;border:0;border-radius:0;min-height:58px;font-weight:500;font-size:13.5px;color:var(--muted);position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){nav.tabs button{font-size:12.5px}}
nav.tabs button[aria-current=page]{color:var(--text);font-weight:700}
nav.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--marigold)}
nav.tabs .badge{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:var(--berry);margin-left:5px;vertical-align:middle}
/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14.5px;z-index:30;max-width:90%}
.match{position:fixed;inset:0;background:var(--berry);color:#fff;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.match h1{color:#fff;font-size:44px}
.match button{border-color:#fff;color:#fff;margin:6px;min-width:220px}
.match .btn-primary{background:#fff;color:var(--berry)}
.tabs-inline{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.tabs-inline button{min-height:38px;padding:7px 14px;border-color:var(--line);font-weight:500}
.tabs-inline button[aria-pressed=true]{border-color:var(--text);background:var(--chip);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:400}
.stat span{font-size:12.5px;color:var(--muted)}
.review-photos{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.review-photos img{height:150px;border-radius:10px}
img:not([src]){visibility:hidden}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.pick label{margin:0;display:inline-flex;align-items:center;font-weight:500;font-size:14.5px;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--surface)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--text);background:var(--chip);font-weight:700}
.pick label:has(input:focus-visible){outline:3px solid var(--marigold);outline-offset:2px}
.fgroup{padding:16px 0;border-top:1px solid var(--line)}
.fgroup:first-of-type{border-top:0}
.fgroup h3{margin:0 0 4px}
.strict{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px;margin:10px 0 0;color:var(--muted)}
.strict input{width:20px;height:20px;accent-color:var(--berry)}
.fcount{position:sticky;top:0;z-index:2;background:var(--paper);padding:10px 0;font-weight:600;border-bottom:1px solid var(--line)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.savebar .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.basics{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.basics span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.disc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0}
.disc-top button{min-height:40px;padding:8px 14px}
.likeon{float:right;min-height:0;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;margin:-4px 0 6px 10px;background:var(--surface)}
.likeon:hover{border-color:var(--berry);color:var(--berry)}
.photo-like{position:absolute;right:12px;bottom:12px;min-height:0;padding:8px 14px;border-radius:999px;background:var(--surface);border:0;font-size:14px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.liked-you{background:var(--chip);border-left:4px solid var(--berry);border-radius:12px;padding:12px 14px;margin:10px 0 12px}
.liked-you b{display:block;margin-bottom:2px}
.liked-you q{font-family:var(--serif);font-size:18px}
.ctx{align-self:center;max-width:90%;text-align:center;font-size:14px;color:var(--muted);background:var(--chip);border-radius:14px;padding:10px 14px;margin:4px 0 10px}
.ctx q{display:block;font-family:var(--serif);font-size:17px;color:var(--text);margin-top:4px}
.newm .lk img{border-color:var(--berry)}
.card[data-swipe]{touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.card.dragging{transition:none}
.card.settle{transition:transform .25s ease}
.card.fly{transition:transform .28s ease-in,opacity .28s ease-in;opacity:0}
.stamp{position:absolute;top:28px;padding:6px 16px;border-radius:10px;border:3px solid;font-weight:700;font-size:26px;background:rgba(255,255,255,.85);opacity:0;pointer-events:none;z-index:2}
.stamp.like{left:20px;color:#9C2F5E;border-color:#9C2F5E;transform:rotate(-12deg)}
.stamp.pass{right:20px;color:#3A4060;border-color:#3A4060;transform:rotate(12deg)}
.swipe-hint{text-align:center;font-size:13px;color:var(--muted);margin:2px 0 0}
@media (prefers-reduced-motion:reduce){.card.settle,.card.fly{transition:none}}
.b.img{padding:4px;background:transparent;border:0}
.b.img img{display:block;max-width:220px;max-height:280px;border-radius:14px;background:var(--chip);min-width:120px;min-height:120px;object-fit:cover}
.typing{font-size:13px;color:var(--muted);margin:2px 4px;min-height:18px}
.seen{font-size:11.5px;color:var(--muted);align-self:flex-end;margin:-2px 4px 6px}
.composer .ph-btn{padding:10px 12px;border-color:var(--line);font-weight:500}
.interests{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.interests span{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.interests span.shared{background:var(--marigold);color:#1B2350;font-weight:600}
.toppick{display:flex;align-items:center;gap:10px;background:var(--marigold);color:#1B2350;border-radius:14px;padding:10px 14px;margin:8px 0 0;font-weight:600}
.toppick small{display:block;font-weight:500;font-size:13px}
.gaps{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.gaps th,.gaps td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.gaps th:first-child,.gaps td:first-child{text-align:left}
.gaps td.short{background:rgba(233,161,43,.22);font-weight:700}
.tablewrap{overflow-x:auto}
.announce{position:relative;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 44px 12px 14px;margin:8px 0;font-size:14.5px}
.announce b{display:block;font-size:12.5px;opacity:.8;font-weight:600}
.announce button{position:absolute;top:6px;right:6px;min-height:0;padding:6px 10px;border:0;color:var(--paper);font-size:13px}
.event{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.event .date{font-weight:700;color:var(--berry);font-size:14px}
.event h2{margin:4px 0 6px}
.event .meta{color:var(--muted);font-size:14px;margin-bottom:10px}
.event .going{font-size:14px;font-weight:600;margin:10px 0}
.pgroup{margin:18px 0 4px}
.pgroup h3{margin:0 0 6px}
.pcount{position:sticky;top:0;z-index:2;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.pcount b{font-size:15px}
.pick label.hide{display:none}
.match .pair{display:flex;justify-content:center;margin-bottom:22px}
.match .av{position:relative;width:112px;height:112px;border-radius:50%;border:4px solid #fff;background:#C24A7D;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;color:#fff}
.match .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.match .av + .av{margin-left:-22px}
.match .shared{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0 14px;max-width:360px}
.match .shared span{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:14px}
.match .note{font-family:var(--serif);font-size:19px;max-width:340px;margin:0 0 18px;opacity:.95}
.match .actions{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.planner{position:fixed;inset:0;z-index:22;background:#0A0A0A;color:#F5F5F5;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(120px + env(safe-area-inset-bottom,0px))}
.planner .pin{max-width:480px;margin:0 auto}
.planner .phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.planner .phead button{border:0;color:#F5F5F5;min-height:40px;padding:6px 0;font-weight:500;background:none}
.planner .phead b{font-size:16px}
.planner h2{color:#F5F5F5;font-size:22px;margin:22px 0 10px}
.planner h1{color:#FFB800}
.planner p{color:#F5F5F5}
.planner .pm{color:#8E8E93}
.planner select,.planner input[type=text],.planner input[type=time],.planner input[type=datetime-local]{background:#1C1C1E;color:#F5F5F5;border:1px solid #333333}
.planner label{color:#F5F5F5}
.planner .errors{border-color:#E31C25;color:#FF6B72}
.pchips{display:flex;gap:8px}
.pchips button{flex:1;border:1px solid #333333;color:#F5F5F5;background:#1C1C1E;min-height:46px}
.pchips button[aria-pressed=true]{background:#00A859;border-color:#00A859;color:#0A0A0A}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x proximity}
.days button{flex:none;width:62px;min-height:74px;border:1px solid #333333;background:#1C1C1E;color:#F5F5F5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:6px;scroll-snap-align:start}
.days button b{font-size:22px;font-weight:600}
.days button[aria-pressed=true]{background:#00A859;border-color:#00A859;color:#0A0A0A}
.opt{display:flex;align-items:center;gap:10px;background:#1C1C1E;border-radius:14px;padding:10px 12px;margin:8px 0}
.opt .grow{flex:1;font-weight:600;font-size:15px}
.opt input[type=time]{width:auto;padding:8px;min-height:40px}
.opt button{border:0;color:#8E8E93;min-height:0;padding:6px;font-weight:500;background:none}
.opt.add{border:1px dashed #333333;background:transparent;color:#8E8E93;justify-content:center;font-weight:500}
.btn-go{background:#00A859;border-color:#00A859;color:#0A0A0A}
.btn-gold{background:#FFB800;border-color:#FFB800;color:#0A0A0A}
.btn-ghost{border:1px solid #333333;background:#1C1C1E;color:#F5F5F5}
.btn-red{border:1.5px solid #E31C25;color:#E31C25;background:transparent}
.btn-mute{border:0;background:none;color:#8E8E93;min-height:0;padding:10px 0;font-weight:500}
.pbar{position:fixed;left:0;right:0;bottom:0;background:#0A0A0A;border-top:1px solid #1C1C1E;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:23}
.pbar .pin{display:flex;gap:10px}
.card.vcard{background:#1C1C1E;border:0;color:#F5F5F5;margin-top:14px}

   Lockup: "row" in page headers, "stack" on full-screen moments. Emblem never sits on top of a face. */
@font-face{font-family:"Midnight Lora";src:url("preview-assets/Lora.ttf") format("truetype");font-style:normal;font-weight:400 700;font-display:swap}
@font-face{font-family:"Midnight DM Sans";src:url("preview-assets/DMSans.ttf") format("truetype");font-style:normal;font-weight:100 1000;font-display:swap}
:root{
  --native-obsidian:#111111;--native-emerald:#0F5C4D;--native-gold:#C89A2B;
  --native-ivory:#F6F0E8;--native-sienna:#8A3324;--native-terracotta:var(--native-sienna);
  --native-serif:"Midnight Lora",Georgia,"Times New Roman",serif;
  --native-sans:"Midnight DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --native-ink-2:#111111B8;--native-hair:#1111111F;--native-wash:#1111110A;
  --native-on-dark-2:#F6F0E8CC;--native-on-dark-hair:#F6F0E840;
  --native-card-radius:24px;--native-radius-sm:14px;--native-pill-radius:999px;
  --native-demo-inset:0px;--native-space:8px;--native-shadow:0 1px 2px #1111110F,0 16px 40px #1111111A;
}
body[data-midnight]{
  --text:var(--native-obsidian);--muted:var(--native-ink-2);--paper:var(--native-ivory);
  --berry:var(--native-terracotta);--line:var(--native-hair);--chip:var(--native-wash);
  --sans:var(--native-sans);background:var(--native-obsidian);color:var(--native-obsidian);
  font-family:var(--native-sans);font-weight:500;letter-spacing:0;
}
body[data-midnight] .app{box-shadow:none;background:var(--native-ivory)}
body[data-midnight] :focus-visible,.native-match :focus-visible{outline:3px solid var(--native-gold);outline-offset:3px}

/* Lockup */
.native-logo{display:inline-flex;align-items:center;gap:10px;color:inherit;line-height:1}
.native-logo .brand-emblem{display:block;width:36px;height:36px;object-fit:contain;flex-shrink:0}
.native-logo .native-word{font-family:var(--native-sans);font-size:15px;font-weight:800;letter-spacing:.18em;white-space:nowrap}
.native-logo.stack{flex-direction:column;gap:12px}
.native-logo.stack .brand-emblem{width:56px;height:56px}
.native-logo.stack .native-word{font-size:13px;letter-spacing:.32em;margin-right:-.32em}

/* Shared components */
.native-pill{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;border:0;border-radius:var(--native-pill-radius);padding:14px 28px;background:var(--native-terracotta);color:var(--native-ivory);font-family:var(--native-sans);font-size:18px;font-weight:700;letter-spacing:.01em;box-shadow:0 8px 24px #8A332440}
.native-pill:hover,.native-pill:active{background:var(--native-terracotta);color:var(--native-ivory);box-shadow:0 10px 28px #8A332459}
.native-arrow{width:22px;height:22px}
.native-circle{display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.native-badge{display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;border-radius:var(--native-pill-radius);font-size:13px;line-height:1.3;font-weight:700;background:var(--native-emerald);color:var(--native-ivory)}
.native-badge.soft{color:var(--native-obsidian);background:var(--native-wash);font-weight:600}
.native-profile-badges{display:flex;flex-wrap:wrap;gap:8px}
.native-eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px}

/* Welcome */
body[data-route=welcome] header.top{display:none}
body[data-route=welcome] .app{min-height:calc(100dvh - var(--native-demo-inset))}
body[data-route=welcome] main{padding:0}
body[data-route=welcome] .welcome{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-height:calc(100svh - var(--native-demo-inset));padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px));background:var(--native-obsidian);color:var(--native-ivory);overflow:hidden}
.native-welcome-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;z-index:-2}
body[data-route=welcome] .welcome::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#111111B3 0%,#11111100 16%,#11111100 38%,#111111A6 56%,#111111EB 72%,#111111 88%)}
body[data-route=welcome] .welcome .native-logo{align-self:flex-start}
body[data-route=welcome] .welcome .native-logo .brand-emblem{width:40px;height:40px}
.native-welcome-copy{margin-top:auto}
body[data-route=welcome] .welcome h1{font-family:var(--native-serif);font-size:clamp(36px,10.4vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.06;max-width:none;margin:0;color:var(--native-ivory);text-wrap:balance}
.native-welcome-copy h1 span{display:block;color:var(--native-gold)}
.native-rule{display:block;width:48px;height:2px;border-radius:2px;background:var(--native-gold);margin:20px 0 16px}
.native-welcome-copy>p{font-size:18px;line-height:1.4;font-weight:700;letter-spacing:.01em;margin:0 0 28px;color:var(--native-ivory)}
.native-welcome-copy .native-pill{width:100%;margin:0}
body[data-route=welcome] .welcome .welcome-note{color:var(--native-on-dark-2);font-size:14px;line-height:1.5;font-weight:500;padding:0;margin:16px 0 0;text-align:center}
.native-eligibility-detail{font-size:14px;line-height:1.5;font-weight:600;margin-top:4px;color:var(--native-ivory);text-align:center}
.native-eligibility-detail summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;list-style:none;min-height:44px;padding:0 8px;text-decoration:underline;text-decoration-color:var(--native-gold);text-underline-offset:5px}
.native-eligibility-detail summary::-webkit-details-marker{display:none}
.native-eligibility-detail summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--native-gold);border-bottom:2px solid var(--native-gold);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.native-eligibility-detail[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.native-eligibility-detail p{margin:4px 0 8px;font-weight:500;color:var(--native-on-dark-2)}
body[data-route=welcome] .native-welcome-copy .native-welcome-disclosure{font-size:12px;line-height:1.5;font-weight:500;margin:12px 0 0;color:var(--native-on-dark-2);text-align:center}

/* Discover: header */
body[data-midnight] header.top{position:sticky;z-index:6;min-height:64px;padding:12px 20px;background:var(--native-ivory);color:var(--native-obsidian);border:0;border-bottom:1px solid var(--native-hair)}
body[data-midnight] .wordmark{position:static;transform:none;color:var(--native-obsidian)}
body[data-midnight] header.top .brand-emblem{width:32px;height:32px}
body[data-midnight] header.top .native-word{font-size:14px}
body[data-midnight] #hdr{margin-left:auto}
body[data-midnight] #hdr button{background:transparent;color:var(--native-ink-2);border:1px solid var(--native-hair);min-height:36px!important;padding:6px 14px!important;border-radius:var(--native-pill-radius);font-size:13px;font-weight:600}

/* Discover: page */
body[data-midnight] main{padding:0 20px 120px}
body:is([data-route=discover],[data-route=view]) main{padding-bottom:200px}
body[data-route=discover] .discover-heading{margin:20px 0 0}
body[data-route=discover] .discover-heading h1{font-family:var(--native-sans);font-size:28px;line-height:1.15;color:var(--native-obsidian);font-weight:700;letter-spacing:-.01em;margin:0}
body[data-route=discover] .discover-heading p{font-size:14px;line-height:1.4;color:var(--native-ink-2);font-weight:500;margin:4px 0 0}
body[data-route=discover] .disc-top{margin:12px 0 16px;min-height:40px}
body[data-route=discover] .disc-top .small{color:var(--native-obsidian);font-size:14px;font-weight:600}
body[data-route=discover] main .disc-top button{background:transparent;border:1px solid var(--native-hair);color:var(--native-obsidian);border-radius:var(--native-pill-radius);min-height:40px;padding:8px 18px;font-size:14px;font-weight:600}

/* Discover: card */
body:is([data-route=discover],[data-route=view],[data-route=me]) .card{background:var(--native-ivory);border:1px solid var(--native-hair);border-radius:var(--native-card-radius);box-shadow:var(--native-shadow);overflow:hidden;margin:0 0 16px}
body:is([data-route=discover],[data-route=view]) .card>.card-photo{height:clamp(300px,calc(100svh - 380px - var(--native-demo-inset)),560px);aspect-ratio:auto;max-height:none;background:var(--native-emerald);border-radius:0}
body:is([data-route=discover],[data-route=view],[data-route=me]) .card-photo>img{object-position:center 25%}
body:is([data-route=discover],[data-route=view],[data-route=me]) .card-photo::after{content:"";display:block;position:absolute;inset:45% 0 0;background:linear-gradient(180deg,#11111100,#11111199 45%,#111111E6);pointer-events:none}
body:is([data-route=discover],[data-route=view],[data-route=me]) .dots{top:12px;left:16px;right:16px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .dots i{height:3px;background:#F6F0E866}body:is([data-route=discover],[data-route=view],[data-route=me]) .dots i.on{background:var(--native-ivory)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .photo-identity{position:absolute;left:20px;right:20px;bottom:20px;z-index:1;pointer-events:none;color:var(--native-ivory);padding:0}
body:is([data-route=discover],[data-route=view],[data-route=me]) .photo-identity h2{font-family:var(--native-sans);font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--native-ivory);margin:0 0 4px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .photo-identity p{font-size:16px;font-weight:500;color:var(--native-on-dark-2);opacity:1;margin:0 0 12px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .photo-identity .native-badge.soft{background:#F6F0E829;color:var(--native-ivory);box-shadow:inset 0 0 0 1px var(--native-on-dark-hair);backdrop-filter:blur(8px)}
.native-toppick{position:absolute;z-index:1;top:28px;left:16px;display:inline-flex;align-items:center;gap:8px;margin:0;pointer-events:none;padding:6px 12px 6px 10px;border-radius:var(--native-pill-radius);background:#111111B3;box-shadow:inset 0 0 0 1px #C89A2B99;color:var(--native-gold);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;backdrop-filter:blur(8px)}
.native-toppick::before{content:"";width:12px;height:12px;background:var(--native-gold);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .photo-like{top:28px;bottom:auto;right:16px;width:44px;height:44px;background:var(--native-ivory);color:var(--native-obsidian);border:0;box-shadow:0 4px 16px #11111133}
body:is([data-route=discover],[data-route=view],[data-route=me]) .photo-like:hover{background:var(--native-ivory);color:var(--native-terracotta)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .stamp{background:var(--native-ivory)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .stamp.like{color:var(--native-emerald);border-color:var(--native-emerald)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .stamp.pass{color:var(--native-obsidian);border-color:var(--native-obsidian)}

/* Discover: card body */
body:is([data-route=discover],[data-route=view],[data-route=me]) .card-body{padding:20px 20px 24px}
.native-why{display:block;margin:0 0 20px;padding:14px 16px;border-radius:var(--native-radius-sm);background:#C89A2B1F;border-left:3px solid var(--native-gold)}
.native-why b{display:block;margin:0 0 4px;color:var(--native-emerald);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.native-why span{display:block;font-size:16px;line-height:1.45;font-weight:600;color:var(--native-obsidian)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .card-sub{color:var(--native-obsidian);font-size:16px;font-weight:600;margin:0 0 16px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .liked-you{margin:0 0 20px;padding:14px 16px;border-radius:var(--native-radius-sm);border:0;border-left:3px solid var(--native-emerald);background:#0F5C4D12;color:var(--native-emerald);font-size:16px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .liked-you b{font-weight:700}
body:is([data-route=discover],[data-route=view],[data-route=me]) .liked-you q{font-family:var(--native-serif);font-size:18px;color:var(--native-obsidian)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .basics,body:is([data-route=discover],[data-route=view],[data-route=me]) .interests,body:is([data-route=discover],[data-route=view],[data-route=me]) .chips{gap:8px;margin:0 0 16px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .basics span,body:is([data-route=discover],[data-route=view],[data-route=me]) .interests span,body:is([data-route=discover],[data-route=view],[data-route=me]) .chip{font-size:14px;line-height:1.3;font-weight:600;padding:8px 14px;border-radius:var(--native-pill-radius);color:var(--native-obsidian)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .basics span{background:transparent;border:1px solid var(--native-hair)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .interests span,body:is([data-route=discover],[data-route=view],[data-route=me]) .chip{background:var(--native-wash);border:0}
body:is([data-route=discover],[data-route=view],[data-route=me]) .interests span.shared{background:var(--native-emerald);color:var(--native-ivory)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary h3{font-family:var(--native-sans);font-size:22px;font-weight:700;color:var(--native-emerald)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary :is(summary,dt,dd),body:is([data-route=discover],[data-route=view],[data-route=me]) .prompt .pq,body:is([data-route=discover],[data-route=view],[data-route=me]) .bio{color:var(--native-obsidian)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary dt{font-size:14px;color:var(--native-ink-2)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary dd{font-size:16px;font-weight:600}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary{margin:24px 0 8px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary h3{margin:0 0 8px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary .chips{display:grid;gap:0;margin:0 0 12px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary .chip{position:relative;display:block;padding:12px 0 12px 32px;border-radius:0;background:transparent;border-bottom:1px solid var(--native-hair);font-size:16px;font-weight:600;line-height:1.4}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary .chip::before{content:"";position:absolute;left:2px;top:15px;width:18px;height:18px;border-radius:50%;background:var(--native-emerald)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary .chip::after{content:"";position:absolute;left:8px;top:18px;width:5px;height:9px;border-right:2px solid var(--native-ivory);border-bottom:2px solid var(--native-ivory);transform:rotate(45deg)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .compat-summary summary{min-height:44px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--native-emerald);cursor:pointer}
body:is([data-route=discover],[data-route=view],[data-route=me]) .prompt{padding:20px 0;border-top:1px solid var(--native-hair)}
body:is([data-route=discover],[data-route=view],[data-route=me]) .prompt .pq{font-size:14px;font-weight:600;color:var(--native-ink-2);margin-bottom:8px}
body:is([data-route=discover],[data-route=view],[data-route=me]) .prompt .pa{font-family:var(--native-sans);font-size:22px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
body:is([data-route=discover],[data-route=view],[data-route=me]) .bio{font-size:16px;line-height:1.6;font-weight:500}
body:is([data-route=discover],[data-route=view],[data-route=me]) .likeon{width:40px;height:40px;background:var(--native-ivory);color:var(--native-terracotta);box-shadow:inset 0 0 0 1px var(--native-hair)}

/* Discover: actions sit on a fade so they never cover readable text */
body:is([data-route=discover],[data-route=view]) .card-actions{bottom:calc(84px + env(safe-area-inset-bottom,0px));width:auto;padding:0!important;align-items:center;justify-content:center;gap:24px;background:transparent;border-radius:0;box-shadow:none;backdrop-filter:none}
body:is([data-route=discover],[data-route=view]) .card-actions button{flex:none;flex-direction:column;gap:2px;padding:8px;border:0;border-radius:50%;font-size:12px;font-weight:700;letter-spacing:.02em;box-shadow:0 8px 20px #11111133}
body:is([data-route=discover],[data-route=view]) .card-actions .pass{width:60px;height:60px;min-height:60px;background:var(--native-obsidian);color:var(--native-ivory)}
body:is([data-route=discover],[data-route=view]) .card-actions .like{width:72px;height:72px;min-height:72px;background:var(--native-terracotta);color:var(--native-ivory)}
body:is([data-route=discover],[data-route=view]) .card-actions svg{width:24px;height:24px}
body:is([data-route=discover],[data-route=view]) .card-actions .like svg{width:28px;height:28px;fill:var(--native-ivory);stroke:var(--native-ivory)}
body:is([data-route=discover],[data-route=view]) .under{margin:8px 0 4px}
body:is([data-route=discover],[data-route=view]) .under button,body:is([data-route=discover],[data-route=view]) .swipe-hint{color:var(--native-ink-2);font-size:14px;font-weight:600}
body:is([data-route=discover],[data-route=view]) .swipe-hint{font-weight:500;line-height:1.5}
body:is([data-route=discover],[data-route=view]) main button:not(.pass):not(.like):not(.photo-like):not(.likeon):not(.nav){background:var(--native-ivory);color:var(--native-obsidian)}
body[data-midnight] .btn-primary:not(.like){background:var(--native-terracotta);color:var(--native-ivory);border-color:var(--native-terracotta)}
body[data-midnight] .announce,body[data-midnight] .status{background:#0F5C4D12;border-color:#0F5C4D40;color:var(--native-obsidian);font-size:14px}
body[data-midnight] .announce button{color:var(--native-emerald)}

/* Discover: tab bar */
body[data-midnight] nav.tabs{background:var(--native-ivory);border-top:1px solid var(--native-hair);box-shadow:none}
body:is([data-route=discover],[data-route=view]) nav.tabs::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:132px;background:linear-gradient(180deg,#F6F0E800,#F6F0E8F2 62%,var(--native-ivory));pointer-events:none}
body[data-midnight] nav.tabs button{color:var(--native-ink-2);font-size:12px;font-weight:600;gap:6px}
body[data-midnight] nav.tabs button svg{width:24px;height:24px}
body[data-midnight] nav.tabs button[aria-current=page]{color:var(--native-emerald);font-weight:700}
body[data-midnight] nav.tabs button[aria-current=page]::before{display:block;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--native-emerald)}
body[data-midnight] nav.tabs .badge{background:var(--native-terracotta);border-color:var(--native-ivory)}

/* Match */
.native-match.match{left:max(0px,calc((100% - 480px)/2));right:max(0px,calc((100% - 480px)/2));top:var(--native-demo-inset);padding:40px 24px 32px;min-height:0;overflow-y:auto;justify-content:safe center;font-family:var(--native-sans);font-weight:500;letter-spacing:0;color:var(--native-ivory);background:radial-gradient(130% 60% at 50% 0%,var(--native-emerald) 0%,#0F5C4D00 72%),var(--native-obsidian);isolation:isolate}
.native-match::after{content:"";position:absolute;z-index:-1;left:-20%;right:-20%;bottom:-25%;height:55%;background:radial-gradient(closest-side,#C89A2B2E,#C89A2B00);pointer-events:none}
.native-match .native-logo{flex-shrink:0;margin-bottom:32px}
.native-match.match .pair{position:relative;flex-shrink:0;margin:0 0 28px}
.native-match.match .av{width:132px;height:132px;border:3px solid var(--native-ivory);outline:1px solid #C89A2B99;outline-offset:4px;background:var(--native-emerald);color:var(--native-ivory);box-shadow:0 16px 40px #11111166}
.native-match.match .av+.av{margin-left:-14px}
.native-match .native-match-heart{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--native-terracotta);border:3px solid var(--native-ivory);color:var(--native-ivory);box-shadow:0 6px 16px #11111166}
.native-match .native-match-heart svg{width:22px;height:22px;fill:currentColor;stroke:none}
.native-match.match h1{font-family:var(--native-serif);color:var(--native-ivory);font-size:clamp(36px,10vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0 0 8px}
.native-match .native-match-sub{font-size:18px;font-weight:700;margin:0 0 4px}
.native-match .native-match-context{font-size:16px;font-weight:500;color:var(--native-on-dark-2);margin:0 0 24px}
.native-match-common{width:100%;max-width:340px;padding:20px 0 0;margin:0 0 24px;border-top:1px solid var(--native-on-dark-hair)}

// ---------- Photos ----------
async function compress(file){
  if (!file.type.startsWith("image/")) throw new Error("type");
  if (file.size > 10*1024*1024) throw new Error("size");
  const bmp = await createImageBitmap(file, {imageOrientation:"from-image"});
  let max = 900, q = 0.82, out = "";
  for (let i = 0; i < 8; i++){
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", q); // re-encoding drops EXIF, including location
    if (out.length < 140000) break;
    q = Math.max(0.5, q - 0.08); max -= 90;
  }
  return out;
}
function photosOf(id){
  const p = S.profiles[id], c = S.photoCache[id];
  return (p && c && c.rev === p.revision) ? c.list : null;
}
async function loadPhotos(id){
  const p = S.profiles[id]; if (!p) return;
  const c = S.photoCache[id];
  if ((c && c.rev === p.revision) || S.photoLoading[id] === p.revision) return;
  S.photoLoading[id] = p.revision;
  try {
    const snap = await db.collection(`photos/${id}/p`).get();
    const list = snap.docs.filter(d => d.data().rev === p.revision)
      .sort((a,b) => (a.data().i||0) - (b.data().i||0)).map(d => d.data().img);
    S.photoCache[id] = {rev:p.revision, list};
    fillPhotos(id);
  } catch(e){ console.error(e); }
  finally { delete S.photoLoading[id]; }
}
function img(id, i, cls){
  const list = photosOf(id); if (!list) loadPhotos(id);
  const src = list && list[i] ? list[i] : "";
  const name = esc((S.profiles[id]||{}).name || "Member");
  return `<img class="${cls||""}" data-ph="${esc(id)}:${i}" ${src?`src="${src}"`:""} alt="Photo of ${name}">`;
}
function fillPhotos(id){
  const list = photosOf(id) || [];
  document.querySelectorAll(`img[data-ph^="${CSS.escape(id)}:"]`).forEach(el => {

let room = null, chatRoom = null, chatRoomFor = null, typingTimer = null, peersOff = null;
function roomName(other){
  const k = pairId(other); let h = 5381; for (let i = 0; i < k.length; i++) h = ((h << 5) + h + k.charCodeAt(i)) >>> 0;
  return "c-" + h.toString(36) + "-" + k.length.toString(36);
}
async function joinChatRoom(other){
  if (!room) return;
  if (chatRoomFor === other && chatRoom) return;
  await leaveChatRoom();
  chatRoomFor = other;
  try {
    const r = await room.join(roomName(other));
    if (chatRoomFor !== other){ r.leave(); return; }
    chatRoom = r;
    peersOff = r.onPeers(ch => showTyping(ch.peers), () => {});
  } catch(e){ chatRoom = null; }
}
async function leaveChatRoom(){
  const r = chatRoom; chatRoom = null; chatRoomFor = null;
  if (peersOff){ peersOff(); peersOff = null; }
  if (r){ try { await r.leave(); } catch(_){} }
}
function showTyping(peers){
  const el = $("#typing"); if (!el) return;

}

  if (!chatRoom) return;

const BANDS = [[18,24],[25,29],[30,34],[35,39],[40,44],[45,54],[55,99]];
function gapsView(approved){
  const P = id => S.profiles[id];
  // Supply: live members by gender and age band. Demand: live members who want that gender and whose age range covers the band.
  const rows = BANDS.map(([lo,hi]) => {
    const cells = GENDERS.map(g => {
      const supply = approved.filter(id => P(id).gender === g && P(id).age >= lo && P(id).age <= hi).length;
      const demand = approved.filter(id => (P(id).partnerGenders||[]).includes(g) && P(id).ageMin <= hi && P(id).ageMax >= lo).length;
      return {g, supply, demand, short: demand >= 3 && demand > supply * 2};
    });
    return {lo, hi, cells};
  });
  const label = (lo,hi) => hi >= 99 ? `${lo}+` : `${lo}–${hi}`;
  const plural = {"Woman":"women","Man":"men","Non-binary":"non-binary members"};
  const needs = rows.flatMap(r => r.cells.filter(c => c.short).map(c => `${plural[c.g]} ${label(r.lo,r.hi)}`));
  return `<p class="small muted">Each cell shows live members / members looking for them. Highlighted cells have more than twice as many people looking as there are members, so recruit there first.</p>
    ${needs.length ? `<div class="status"><b>Recruit next:</b> ${esc(needs.slice(0,4).join(", "))}</div>` : `<p class="muted small">No big gaps yet. Gaps appear once at least 3 people are looking for a group.</p>`}
    <div class="tablewrap"><table class="gaps"><thead><tr><th>Age</th>${GENDERS.map(g => `<th>${esc(plural[g].replace(" members",""))}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr><td>${label(r.lo,r.hi)}</td>${r.cells.map(c => `<td class="${c.short?"short":""}">${c.supply} / ${c.demand}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function allInvites(){
  return Object.entries(S.invites).flatMap(([by,doc]) => (doc.items||[]).map(x => ({...x, by}))).sort((a,b) => b.at - a.at);

    for (const ref of tasks) await ref.delete();

function doReact(id, k, extra){
  if (!canReact(id)) return;
  setReaction(id, k, extra);
  S.cardPhoto = 0;
  if (S.priv.disc) savePriv({disc:{...S.priv.disc, queue:(S.priv.disc.queue||[]).filter(x => x !== id)}});
  const t = theirR(id)[uid];
  if (k === "like" && t && t.k === "like") showMatch(id);
  if (S.route === "view"){ S.route = "connections"; render(true); } else render();
}
function doBlock(id){
  setReaction(id, "block");
  if (S.route === "chat") S.route = "connections";
  toast("Blocked."); render(true);
}
function setApproval(id, a){
  S.approvals[id] = a;
  enqueue("appr:"+id, () => db.doc(`approvals/${id}`).set(a));
  render();
}
function showMatch(id){
  const p = S.profiles[id]; if (!p) return;
  savePriv({matchSeen:{...(S.priv.matchSeen||{}), [id]:now()}});
  const mine = myR()[id], theirs = theirR(id)[uid];
  const theyFinished = mine && theirs && theirs.at > mine.at;
  const shared = sharedInterests(id);
  const note = theirs && theirs.note ? theirs.note : "";
  const back = S._last === "discover" ? "Keep exploring" : "Not now";
  $("#layer").innerHTML = `<div class="match native-match" role="dialog" aria-modal="true" aria-labelledby="match-title">
    ${nativeLogo("stack")}
    <div class="pair"><div class="av" aria-hidden="true">${esc((myProfile().name||"Y")[0])}${img(uid,0)}</div><div class="av">${esc(p.name[0])}${img(id,0)}</div><span class="native-match-heart" aria-hidden="true">${icon("heart")}</span></div>

    <div class="native-match-common">
      <p class="native-eyebrow">What you share</p>
      <div class="native-profile-badges">${nativeBadge("Childfree by choice")}</div>
      ${shared.length ? `<div class="shared" aria-label="Shared interests">${shared.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
    </div>
    ${note ? `<p class="note">“${esc(note)}”</p>` : ""}

      ${nativePrimary("Say Hello",`data-act="match-chat" data-id="${esc(id)}"`)}

// Show the match screen for matches the other person completed (live, or while you were away).
function checkNewMatches(){
  if (!myProfile() || !S.loaded.priv || !S.loaded.reactions) return;
  const ids = matchIds();
  if (!S.priv.matchSeen){ savePriv({matchSeen:Object.fromEntries(ids.map(i => [i, now()]))}); return; }
  if ($("#layer").innerHTML || ["editor","chat","eligibility","pledge","passions"].includes(S._last)) return;
  const fresh = ids.filter(i => !S.priv.matchSeen[i]);
  if (fresh.length) showMatch(fresh[0]);
}

      : `<div class="dblock gold"><div class="lbl">${name} wants to plan a date</div><p>${esc(st.init.vibe)} · ${priceStr(st.init.budget)}</p><p class="sub">${(st.init.times||[]).map(fmtAt).map(esc).join("<br>")}</p><div class="row" style="display:flex;gap:8px;align-items:center"><button class="btn-gold" style="flex:1" data-act="plan-swipe" data-id="${id}">Pick a venue</button><button class="btn-mute" data-act="plan-decline" data-id="${id}">Not this time</button></div></div>`;
    case "noMatch": return st.iAmInit
      ? `<div class="dblock"><div class="lbl">Waiting on ${name}</div><p class="sub">${name} is choosing a spot for ${esc(st.init.vibe)}.</p><button class="btn-mute" style="color:#E31C25" data-act="plan-change" data-id="${id}">Cancel proposal</button></div>`
      : `<div class="dblock gold"><div class="lbl">${st.noVenues ? `${name} wants to plan a date` : "No venue match yet"}</div>${st.noVenues ? `<p>${esc(st.init.vibe)} · ${priceStr(st.init.budget)}</p><p class="sub">${(st.init.times||[]).map(fmtAt).map(esc).join("<br>")}</p><p class="sub">Pick a spot you'd like to go.</p>` : `<p class="sub">Ask for new suggestions or pick a spot yourself.</p>`}<div class="row" style="display:flex;gap:8px;align-items:center"><button class="btn-gold" style="flex:1" data-act="plan-fallback" data-id="${id}">Choose a spot</button><button class="btn-mute" data-act="plan-decline" data-id="${id}">Not this time</button></div></div>`;
    case "newRound": return st.iAmInit
      ? `<div class="dblock gold"><div class="lbl">${name} passed on those spots</div><p class="sub">Pick 3 new venues to send.</p><button class="btn-gold btn-block" data-act="plan-newpick" data-id="${id}">Pick 3 new venues</button></div>`
      : `<div class="dblock"><div class="lbl">Waiting on ${name}</div><p class="sub">You asked for new spots. ${name} is picking them.</p></div>`;
    case "pickTime": return st.iAmInit
      ? `<div class="dblock"><div class="lbl">You both liked ${esc(v ? v.name : "a spot")}</div><p class="sub">${name} is picking one of your times.</p></div>`
      : `<div class="dblock gold"><div class="lbl">You both liked ${esc(v ? v.name : "a spot")}!</div><button class="btn-go btn-block" data-act="plan-time" data-id="${id}">Pick a time</button></div>`;
    case "counter": return st.iAmInit
      ? `<div class="dblock gold"><div class="lbl">${name} suggested a new time</div><p class="big">${esc(fmtAt(st.time))}</p><p class="sub">at ${esc(v ? v.name : "your spot")}</p><div class="row" style="display:flex;gap:8px"><button class="btn-go" style="flex:1" data-act="plan-accept" data-id="${id}">Accept time</button><button class="btn-red" data-act="plan-change" data-id="${id}">Cancel</button></div></div>`
      : `<div class="dblock"><div class="lbl">Waiting on ${name}</div><p class="sub">You suggested ${esc(fmtAt(st.time))}. ${name} needs to confirm.</p></div>`;
    case "canceled": return `<div class="dblock"><div class="lbl" style="color:#8E8E93">Date plan canceled</div><p class="sub">${st.byMe ? "You" : name} canceled the plan.${st.reason ? ` “${esc(st.reason)}.”` : ""}</p><button class="btn-mute" style="color:#FFB800" data-act="plan-start" data-id="${id}">Plan another date</button></div>`;
  }
  return "";
}
function milestoneBlock(other){
  const name = esc(S.profiles[other].name), id = esc(other);
  return `<div class="dblock gold" role="note"><div class="lbl">Milestone unlocked</div>
    <p>You and ${name} have exchanged ${MILESTONE} messages!</p>
    <p class="sub">Ready to skip the small talk and meet up? We'll help you pick a spot.</p>
    <button class="btn-gold btn-block" style="margin-top:6px" data-act="plan-start" data-id="${id}">Plan a date</button>
    <button class="btn-mute" data-act="milestone-dismiss" data-id="${id}">Not yet, keep chatting</button></div>`;
}

// ---------- Swipe ----------
const SWIPE_AT = 110;
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let drag = null;
document.addEventListener("pointerdown", e => {
  const c = e.target.closest(".card[data-swipe]");
  if (!c || e.target.closest("button,a,input,textarea,select") || (e.pointerType === "mouse" && e.button !== 0)) return;
  drag = {c, id:c.dataset.swipe, x:e.clientX, y:e.clientY, dx:0, active:false, pid:e.pointerId};
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.active){
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ drag = null; return; } // vertical scroll wins
    if (Math.abs(dx) < 8) return;
    drag.active = true; drag.c.classList.add("dragging");
    try { drag.c.setPointerCapture(e.pointerId); } catch(_){}
  }
  drag.dx = dx;
  drag.c.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
  const o = Math.min(1, Math.abs(dx)/SWIPE_AT);
  drag.c.querySelector(".stamp.like").style.opacity = dx > 0 ? o : 0;
  drag.c.querySelector(".stamp.pass").style.opacity = dx < 0 ? o : 0;
});
function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  if (!d.active) return;
  d.c.classList.remove("dragging");
  S._suppressClick = now();
  if (Math.abs(d.dx) >= SWIPE_AT) swipeOut(d.c, d.id, d.dx > 0 ? "like" : "pass");
  else {
    d.c.classList.add("settle"); d.c.style.transform = "";
    d.c.querySelectorAll(".stamp").forEach(x => x.style.opacity = 0);
    setTimeout(() => d.c.classList.remove("settle"), 260);
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
function swipeOut(c, id, k){
  const act = id === "venue" ? () => venueReact(k) : () => doReact(id, k);
  if (reduceMotion()){ act(); return; }
  const dir = k === "like" ? 1 : -1;
  c.querySelector(".stamp." + k).style.opacity = 1;
  c.classList.add("fly");
  c.style.transform = `translateX(${dir*window.innerWidth*1.1}px) rotate(${dir*18}deg)`;
  setTimeout(act, 260);
}
document.addEventListener("keydown", e => {
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && $(".vcard") && !e.target.closest("input,textarea,select")){
    e.preventDefault(); swipeOut($(".vcard"), "venue", e.key === "ArrowRight" ? "like" : "pass"); return;
  }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && !$("#layer").innerHTML && !e.target.closest("input,textarea,select")){
    const c = document.querySelector(".card[data-swipe]");
    if (c && (S._last === "discover" || S._last === "view")){ e.preventDefault(); swipeOut(c, c.dataset.swipe, e.key === "ArrowRight" ? "like" : "pass"); return; }
  }
  if (e.key === "Escape" && $("#layer").innerHTML) closeSheet();
  if (e.target.id === "compose" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); A.send(); }
});

// ---------- Data ----------
function onData(){
  syncMsgSubs();
  if (S.route === "chat" || S._last === "chat") return render();
  // Don't rebuild forms while someone is typing.
  if (["editor","eligibility","pledge","filters","details","passions"].includes(S._last) && S._last === currentRoute()) { renderNav(S._last); return; }
  render();
  checkNewMatches();
}
function syncMsgSubs(){
  if (!uid) return;
  const want = new Set(matchIds());
  for (const id of Object.keys(S.msgSubs)) if (!want.has(id)){ S.msgSubs[id](); delete S.msgSubs[id]; }
  for (const id of want) if (!S.msgSubs[id]){
    const p = pairId(id);
    S.msgSubs[id] = db.doc(`msgs/${id}/c/${p}`).onSnapshot(s => {
      const d = s.exists ? s.data() : null;
      S.theirMsgs[p] = d && d.to === uid ? (d.list||[]).map(m => ({id:String(m.id||""), t:String(m.t||"").slice(0,1000), img:m.img?String(m.img):"", at:+m.at||0})) : [];
      S.theirSeen[p] = d && d.to === uid ? (+d.seenAt||0) : 0;
      S.theirPlans[p] = d && d.to === uid && d.plan && typeof d.plan === "object" ? clone(d.plan) : null;
      onData();
    }, () => {});
  }
}
function subCollection(path, key){
  db.collection(path).onSnapshot(s => {
    const out = {}; s.docs.forEach(d => { out[d.id] = clone(d.data()); });
    // Keep local writes that haven't come back yet.
    if (key === "reactions" && S.reactions[uid] && !out[uid]) out[uid] = S.reactions[uid];
    S[key] = out; S.loaded[key] = true; onData();
  }, e => { console.error(e); S.loaded[key] = true; onData(); });
}
function fatal(title, text){
  $("#main").innerHTML = `<h1>${esc(title)}</h1><p>${esc(text)}</p>`;
}
async function start(){
  if (!window.claude || !window.claude.use){ fatal("Open this in Claude.", "This app runs inside Claude. Open the link while signed in to claude.ai."); return; }
  const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  window.claude.use("room").then(r => { room = r; if (r && S._last === "chat" && S.chatWith) joinChatRoom(S.chatWith); }).catch(() => {});
  db = d; user = u;
  if (!db || !user){ fatal("Sign in to continue.", "Open this link while signed in to claude.ai to join the founding beta."); return; }
  uid = await user.id();
  owner = await user.isOwner();
  if (!uid){ fatal("Sign in to continue.", "Open this link while signed in to claude.ai to join the founding beta."); return; }
  const canWrite = await user.can("data.write");
  if (canWrite === false) S.readonly = true;
  subCollection("profiles", "profiles");
  subCollection("approvals", "approvals");
  subCollection("reactions", "reactions");
  if (owner){ S.loaded.reports = false; subCollection("reports", "reports"); S.loaded.invites = false; subCollection("invites", "invites"); }
  else {
    db.doc(`reports/${uid}`).onSnapshot(s => { S.reports = s.exists ? {[uid]:clone(s.data())} : {}; }, () => {});
    db.doc(`invites/${uid}`).onSnapshot(s => { S.invites = s.exists ? {[uid]:clone(s.data())} : {}; }, () => {});
  }
  subCollection("events", "events");
  subCollection("venues", "venues");
  subCollection("rsvps", "rsvps");
  db.doc("announce/current").onSnapshot(s => { S.announce = s.exists ? clone(s.data()) : null; onData(); }, () => {});
  db.doc(privPath()).onSnapshot(s => {
    S.priv = s.exists ? clone(s.data()) : {}; S.loaded.priv = true; onData();
  }, e => { console.error(e); S.loaded.priv = true; onData(); });
  db.collection(`msgs/${uid}/c`).onSnapshot(s => {
    const out = {}, seen = {}, plans = {}; s.docs.forEach(x => { out[x.id] = clone(x.data().list || []); seen[x.id] = +x.data().seenAt || 0; if (x.data().plan) plans[x.id] = clone(x.data().plan); });
    S.myMsgs = out; S.mySeen = seen; S.myPlans = plans; onData();
  }, () => {});
  // Mark activity at most twice a day for ranking.
  setTimeout(() => {
    const p = myProfile();
    if (p && now() - (p.lastActive||0) > 12*3600000){
      const patch = {lastActive:now()}, age = S.priv.elig ? ageFrom(S.priv.elig.dob) : null;
      if (age && age !== p.age) patch.age = age;
      enqueue("profile", () => db.doc(`profiles/${uid}`).update(patch));
    }
    if (S.readonly) toast("You have view-only access. Ask the founder for Contributor access to join.");
  }, 4000);
}
start().catch(e => { console.error(e); fatal("Something went wrong.", "Reload the page to try again."); });
})();
</script>
